apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: logging
  labels:
    app.kubernetes.io/name: fluent-bit
data:
  fluent-bit.conf: |
    [SERVICE]
        Daemon           Off
        Flush            5
        Log_Level        info
        Parsers_File     parsers.conf
        HTTP_Server      On
        HTTP_Listen      0.0.0.0
        HTTP_Port        2020
        Health_Check     On

    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        multiline.parser  cri
        Tag               kube.*
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Merge_Log           On
        Merge_Log_Key       log_processed
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off
        Use_Kubelet         Off

    [OUTPUT]
        Name              es
        Match             kube.*
        Host              logging-es-es-http.logging.svc
        Port              9200
        HTTP_User         ${ES_USER}
        HTTP_Passwd       ${ES_PASSWORD}
        tls               Off
        Suppress_Type_Name On
        Logstash_Format   On
        Logstash_Prefix   kubernetes-logs
        Replace_Dots      On
        Retry_Limit       False