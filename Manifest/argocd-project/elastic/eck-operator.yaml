apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eck-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://repo.mci.dev/artifactory/api/helm/elastic-virtual
    chart: eck-operator
    targetRevision: 3.4.0
    helm:
      valuesObject:
        image:
          repository: docker.mci.dev/elastic/eck-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: elastic-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true